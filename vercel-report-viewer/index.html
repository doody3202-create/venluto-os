<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Venluto Client Report</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap');*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,#ded5ff,transparent 28%),#f5f2fb;color:#18132f;font-family:'DM Sans',sans-serif}.page{width:min(1180px,calc(100% - 32px));margin:34px auto}.report{overflow:hidden;border:1px solid #d8cef4;border-radius:24px;background:#fbfaff;box-shadow:0 34px 80px #4c31a32e}.cover{padding:38px 44px 42px;background:radial-gradient(circle at 82% 18%,#ae94ff47,transparent 34%),linear-gradient(145deg,#fff,#f4efff 62%,#e8e1ff)}.brand{display:flex;align-items:center;gap:10px;padding-bottom:24px;border-bottom:1px solid #ddd4f1;font-size:11px;font-weight:800;letter-spacing:.12em}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#805ce9,#4e3ab6);color:#fff}.brand time{margin-left:auto;color:#756d88;font-size:11px;font-weight:600;letter-spacing:0}.kicker,.sectionTitle small,.diagnosis b{display:block;color:#6d46df;font-size:11px;font-weight:800;letter-spacing:.14em}.kicker{margin-top:72px}.cover h1{max-width:870px;margin:18px 0 20px;font:400 clamp(48px,7vw,84px)/.96 Fraunces,serif;letter-spacing:-.045em}.cover h1 em{color:#6d46df}.lead{max-width:650px;color:#6f687f;font-size:16px;line-height:1.65}.verdict{max-width:850px;margin:28px 0;padding:22px;border:1px solid #d7cdf1;border-radius:15px;background:#ffffffd6;box-shadow:inset 4px 0 #7a56e2,0 12px 30px #4b309b14}.verdict strong{display:block;margin:10px 0 7px;font:600 24px Fraunces,serif}.verdict p{margin:0;color:#6f687f;line-height:1.55}.heroStats,.score{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #d7cdf0;border-radius:15px;background:#fff;overflow:hidden}.heroStats div,.score div{padding:22px;border-right:1px solid #e2dcf1}.heroStats div:last-child,.score div:nth-child(4n){border-right:0}.heroStats strong,.heroStats span,.score strong,.score span{display:block}.heroStats strong,.score strong{font:500 31px Fraunces,serif}.heroStats span,.score span{margin-top:7px;color:#756d88;font-size:11px}.section{padding:58px 44px;border-top:1px solid #e2dbf4}.section:nth-child(odd){background:#f3effd}.sectionTitle{display:grid;grid-template-columns:160px 1fr 300px;gap:20px;align-items:end;margin-bottom:30px}.sectionTitle h2{margin:0;font:500 38px Fraunces,serif}.sectionTitle p{margin:0;color:#756d88;line-height:1.55}.score{grid-template-columns:repeat(4,1fr)}.score div{min-height:110px;border-bottom:1px solid #e2dcf1}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.flow article{padding:20px;border:1px solid #d9d0ee;border-radius:14px;background:linear-gradient(145deg,#fff,#f0ebff)}.flow b,.flow strong,.flow span{display:block}.flow b{color:#6d46df;font-size:11px}.flow strong{margin:18px 0 6px;font:500 32px Fraunces,serif}.flow span{color:#756d88;font-size:11px}.diagnoses{display:grid;grid-template-columns:1fr 1fr;gap:12px}.diagnosis{padding:22px;border:1px solid #dcd4ef;border-radius:14px;background:#fff;box-shadow:inset 4px 0 #7655dd}.diagnosis h3{margin:16px 0 8px;font:600 22px Fraunces,serif}.diagnosis p{margin:0;color:#746d84;line-height:1.6}.campaigns{border:1px solid #dcd4ef;border-radius:14px;background:#fff;overflow:hidden}.campaign{display:grid;grid-template-columns:minmax(260px,1.8fr) repeat(4,minmax(75px,.5fr));gap:12px;align-items:center;padding:16px 18px;border-top:1px solid #e7e1f2}.campaign:first-child{border-top:0;background:#eee9fb;color:#6f6781;font-size:11px;font-weight:800;text-transform:uppercase}.campaign strong,.campaign small{display:block}.campaign small{margin-top:4px;color:#837b91}.footer{display:flex;justify-content:space-between;align-items:end;gap:30px;padding:44px;background:linear-gradient(135deg,#eee9ff,#ded3ff);border-top:1px solid #cfc1f4}.footer strong{font:600 27px Fraunces,serif}.footer span{color:#625a77;font-size:12px}@media(max-width:760px){.page{width:min(100% - 18px,1180px);margin:10px auto}.cover,.section,.footer{padding:28px 20px}.brand time{display:none}.kicker{margin-top:44px}.cover h1{font-size:44px}.heroStats,.score{grid-template-columns:1fr 1fr}.sectionTitle{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.diagnoses{grid-template-columns:1fr}.campaigns{overflow:auto}.campaign{min-width:680px}.footer{align-items:flex-start;flex-direction:column}}.loading{min-height:100vh;display:grid;place-items:center;color:#6d46df;font-weight:800}.error{color:#9d3552}
</style></head><body><main id="app" class="loading">Loading Venluto report…</main><script>
const n=v=>Number(v||0).toLocaleString(),pct=(a,b)=>b?Math.round(a/b*1000)/10:0,token=new URLSearchParams(location.search).get('report');
function insight(t){const rr=pct(t.replies,t.peopleContacted),rq=pct(t.opportunities,t.replies),br=pct(t.meetingsBooked,t.opportunities),sr=pct(t.meetingsCompleted,t.meetingsBooked);if(rr<.5)return['DELIVERABILITY IS THE CONSTRAINT',`Only ${rr}% of ${n(t.peopleContacted)} contacted people replied.`,`With ${n(t.emailsSent)} emails sent, the response signal is below the 0.5% healthy threshold. Audit inbox placement, domains and copy risk before scaling.`];if(t.replies&&rq<10)return['THE LIST OR OFFER IS THE CONSTRAINT',`${n(t.replies)} replies produced only ${n(t.opportunities)} opportunities.`,`Only ${rq}% of replies became qualified interest. Revisit the audience fit, pain relevance and promised outcome.`];if(t.opportunities&&br<15)return['MEETING CONVERSION IS THE CONSTRAINT',`${n(t.opportunities)} opportunities produced only ${n(t.meetingsBooked)} meetings.`,`The ${br}% booking rate points to speed-to-lead, follow-up depth or a weak reason to meet—not deliverability.`];if(t.meetingsBooked&&sr<70)return['SHOW RATE IS THE CONSTRAINT',`${n(t.meetingsBooked)} meetings were booked, but only ${n(t.meetingsCompleted)} showed.`,`A ${sr}% show rate points to calendar and pipeline management. Strengthen reminders, agenda-setting and pre-call proof.`];return['THE FUNNEL IS MOVING',`${n(t.peopleContacted)} contacts created ${n(t.opportunities)} opportunities and ${n(t.meetingsBooked)} meetings.`,'No critical threshold is failing. Scale the strongest campaign pattern without weakening reply quality.']}
async function load(){if(!token)throw Error('Missing report link');const r=await fetch(`/api/report?token=${encodeURIComponent(token)}`);if(!r.ok)throw Error('This report is unavailable');const d=await r.json(),t=d.totals,rr=pct(t.replies,t.peopleContacted),or=pct(t.opportunities,t.peopleContacted),rq=pct(t.opportunities,t.replies),br=pct(t.meetingsBooked,t.opportunities),sr=pct(t.meetingsCompleted,t.meetingsBooked),cr=pct(t.closedWon,t.meetingsCompleted),i=insight(t),period=d.range==='7d'?'Weekly':d.range==='30d'?'Monthly':d.range==='90d'?'Quarterly':d.range==='all'?'All-time':d.range+' review',metrics=[['People contacted',n(t.peopleContacted)],['Emails sent',n(t.emailsSent)],['Replies',n(t.replies)],['Reply rate',rr+'%'],['Opportunities',n(t.opportunities)],['Opportunity rate',or+'%'],['Meetings booked',n(t.meetingsBooked)],['Booking rate',br+'%'],['Showed up',n(t.meetingsCompleted)],['Show rate',sr+'%'],['Closed won',n(t.closedWon)],['New MRR','$'+n(Math.round(t.revenueCents/100))],],findings=[['DELIVERABILITY',rr<.5?`${rr}% is below the 0.5% threshold`:`${rr}% reply rate is above threshold`,rr<.5?'Audit domains, inbox placement and copy risk before changing the offer.':'Sending is creating replies. Optimize the next conversion point.'],['AUDIENCE & OFFER',`${n(t.opportunities)} opportunities from ${n(t.replies)} replies`,`${rq}% of replies qualified. Review the audience and promise if this ratio weakens.`],['MEETING CONVERSION',`${n(t.meetingsBooked)} meetings from ${n(t.opportunities)} opportunities`,`${br}% booked. Below 15% points to follow-up speed, depth or reason-to-meet.`],['SHOW RATE',`${n(t.meetingsCompleted)} showed from ${n(t.meetingsBooked)} booked`,`${sr}% showed. Below 70% points to calendar and pipeline management.`]];
document.title=`${d.client.name} · Venluto Report`;document.getElementById('app').className='page';document.getElementById('app').innerHTML=`<article class="report"><header class="cover"><div class="brand"><span class="mark">V</span>VENLUTO × ${d.client.name.toUpperCase()}<time>${period} growth report · ${new Date(d.generatedAt).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</time></div><span class="kicker">OUTBOUND PERFORMANCE · ${d.range==='all'?'ALL TIME':'LAST '+d.range.toUpperCase()}</span><h1>From outbound activity<br>to <em>business outcomes.</em></h1><p class="lead">A clear view of what moved, where the funnel is working and the next constraint to solve.</p><div class="verdict"><span class="kicker" style="margin:0">${i[0]}</span><strong>${i[1]}</strong><p>${i[2]}</p></div><div class="heroStats">${[['people contacted',t.peopleContacted],['replies',t.replies],['opportunities',t.opportunities],['meetings booked',t.meetingsBooked]].map(x=>`<div><strong>${n(x[1])}</strong><span>${x[0]}</span></div>`).join('')}</div></header><section class="section"><div class="sectionTitle"><small>01 · SCORECARD</small><h2>Every number that matters.</h2><p>Smartlead activity and Venluto pipeline outcomes inside the selected period.</p></div><div class="score">${metrics.map(x=>`<div><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div></section><section class="section"><div class="sectionTitle"><small>02 · FUNNEL</small><h2>Where activity becomes revenue.</h2></div><div class="flow">${[['Replies',t.replies,''],['Opportunities',t.opportunities,or+'%'],['Booked',t.meetingsBooked,br+'%'],['Showed',t.meetingsCompleted,sr+'%'],['Closed',t.closedWon,cr+'%']].map((x,j)=>`<article><b>0${j+1}</b><strong>${n(x[1])}</strong><span>${x[0]} ${x[2]?'· '+x[2]:''}</span></article>`).join('')}</div></section><section class="section"><div class="sectionTitle"><small>03 · PLAYBOOK DIAGNOSIS</small><h2>What the numbers are telling us.</h2><p>Analysis follows the Venluto operating playbook.</p></div><div class="diagnoses">${findings.map(x=>`<article class="diagnosis"><b>${x[0]}</b><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div></section><section class="section"><div class="sectionTitle"><small>04 · CAMPAIGNS</small><h2>The messages creating signal.</h2><p>Ranked by qualified opportunities, then replies.</p></div><div class="campaigns"><div class="campaign"><span>Campaign</span><span>Contacted</span><span>Replies</span><span>Reply rate</span><span>Opportunities</span></div>${[...d.campaigns].sort((a,b)=>b.opportunities-a.opportunities||b.replies-a.replies).slice(0,8).map(c=>`<div class="campaign"><span><strong>${c.name}</strong><small>${c.status||'tracked'}</small></span><span>${n(c.contacted)}</span><span>${n(c.replies)}</span><span>${pct(c.replies,c.contacted)}%</span><span>${n(c.opportunities)}</span></div>`).join('')}</div></section><footer class="footer"><strong>Prepared by Venluto.</strong><span>Outbound systems that compound.</span></footer></article>`}
load().catch(e=>{document.getElementById('app').innerHTML=`<span class="error">${e.message}</span>`})
</script></body></html>
